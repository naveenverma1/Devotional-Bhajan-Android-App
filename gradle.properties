# Project-wide Gradle settings for v4.0.
org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# AndroidX is the only supported configuration. Jetifier is no longer
# needed -- everything in our deps tree is already AndroidX.
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true

# Kotlin code style for the new files.
kotlin.code.style=official
kotlin.incremental=true

# compileSdk 36 with AGP 8.7.3 (max tested 35) -- see app/build.gradle.
android.suppressUnsupportedCompileSdk=36
